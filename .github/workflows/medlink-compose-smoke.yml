name: MediLink - Despliegue HTTPS y seed demo

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'gateway/**'
      - 'database/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'scripts/smoke_gateway.sh'
      - 'scripts/smoke_roles.py'
      - 'scripts/tests/test_smoke_roles_contract.py'
      - 'scripts/reportar_evidencia_ac.py'
      - 'scripts/medir_p95.py'
      - 'scripts/tests/test_medir_p95.py'
      - 'scripts/tests/test_reportar_evidencia_ac.py'
      - 'docs/MATRIZ_ACEPTACION_MVP_v1.4.3.md'
      - '.github/workflows/medlink-compose-smoke.yml'
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    name: Docker Compose + Flyway + React + API (HTTPS)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar entorno efimero de CI
        shell: bash
        run: |
          cat > .env <<EOF
          POSTGRES_DB=medlink
          POSTGRES_USER=medlink
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          JWT_SECRET_BASE64=$(openssl rand -base64 48 | tr -d '\n')
          DB_FLYWAY_BASELINE_ON_MIGRATE=false
          HTTPS_PORT=8443
          EOF
      - name: Compilar e iniciar migraciones sin scripts initdb
        run: |
          docker compose --profile api config --quiet
          docker compose --profile api up -d --build
      - name: Probar SPA, API y rutas directas HTTPS
        run: bash scripts/smoke_gateway.sh
      - name: Probar carga EXPLICITA del seed demo sobre esquema Flyway
        run: |
          docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f /opt/medlink/02_datos_prueba.sql'
          curl -ksS --fail -X POST https://localhost:8443/api/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"correo":"admin@medlink.test","contrasena":"Password123!"}' \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["perfil"]["rol"]=="ADMINISTRADOR"'
      - name: Probar contrato del runner de recorridos API
        run: python3 -m unittest discover -s scripts/tests -p 'test_smoke_roles_*.py' -v
      - name: Probar generador de indice de evidencias AC
        run: python3 -m unittest discover -s scripts/tests -p 'test_reportar_evidencia_ac.py' -v
      - name: Recorridos reales por rol, stock, receta e idempotencia
        id: api_smoke
        env:
          MEDLINK_SMOKE_EPHEMERAL: '1'
          # Credencial EXCLUSIVAMENTE del seed ficticio de la base descartable.
          MEDLINK_DEMO_PASSWORD: Password123!
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/smoke_roles.py --demo-ack SEED_DEMO_EFIMERO | tee "$RUNNER_TEMP/medlink_smoke_roles.log"
      - name: Preparar Node 22 para la prueba de navegador
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar la espera de sesiones en Playwright
        run: node --test frontend/scripts/tests/esperar_sesion_ui.test.mjs
      - name: Instalar Playwright para navegador real (Chromium y Firefox)
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm install --prefix frontend --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          cd frontend
          npx playwright install --with-deps chromium firefox
      - name: Navegar React, roles y responsive en navegadores reales (AC-48)
        env:
          MEDLINK_UI_EPHEMERAL: '1'
          MEDLINK_DEMO_PASSWORD: Password123!
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidencias/ui_ci"
          cd frontend
          # Record the precise stage and failure. Do not turn a failing browser run green.
          MEDLINK_UI_EVIDENCE_DIR="$GITHUB_WORKSPACE/evidencias/ui_ci" node scripts/validar_ui.mjs --demo-ack \
            2>&1 | tee "$GITHUB_WORKSPACE/evidencias/ui_ci/playwright.log"
          status=${PIPESTATUS[0]}
          if [ ! -f "$GITHUB_WORKSPACE/evidencias/ui_ci/resultado_ui.json" ]; then
            printf '{"status":"FAIL","reason":"Playwright did not finish its result artifact"}\n' \
              > "$GITHUB_WORKSPACE/evidencias/ui_ci/resultado_ui.json"
          fi
          exit "$status"
      - name: Probar el calculo p95 antes de medir carga
        if: ${{ !cancelled() && steps.api_smoke.outcome == 'success' }}
        run: python3 -m unittest discover -s scripts/tests -p 'test_medir_p95.py' -v
      - name: Medir RNF-11 en base efimera y conservar hardware y dataset
        if: ${{ !cancelled() && steps.api_smoke.outcome == 'success' }}
        env:
          MEDLINK_PERF_EPHEMERAL: '1'
          MEDLINK_DEMO_PASSWORD: Password123!
        run: |
          python3 -m scripts.medir_p95 --demo-ack SEED_DEMO_EFIMERO --iterations 25 --workers 4 \
            --out evidencias/perf_ci/resultado_p95.json
      - name: Registrar evidencias AC de los recorridos
        if: ${{ !cancelled() && steps.api_smoke.outcome == 'success' }}
        shell: bash
        run: |
          python3 scripts/reportar_evidencia_ac.py \
            --api-log "$RUNNER_TEMP/medlink_smoke_roles.log" \
            --ui-evidence evidencias/ui_ci/resultado_ui.json \
            --sha "$GITHUB_SHA" --out-dir evidencias/indice_ac_e2e
          head -n 10 evidencias/indice_ac_e2e/indice_ac.md >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnostico (sin secretos)
        if: failure()
        run: docker compose --profile api ps
      - name: Conservar evidencia de API y matriz parcial
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: medlink-ac-e2e-evidencia
          path: |
            evidencias/indice_ac_e2e/
            evidencias/ui_ci/
            evidencias/perf_ci/
            ${{ runner.temp }}/medlink_smoke_roles.log
          if-no-files-found: warn
          retention-days: 90
      - name: Apagar entorno efimero
        if: always()
        run: |
          docker compose --profile api down --remove-orphans || true
          rm -f .env
