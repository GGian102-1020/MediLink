name: MediLink - Integracion PostgreSQL

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'fix/**'
      - 'feature/**'
      - 'auditoria-infraestructura'
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    name: Maven + PostgreSQL 16 + Auditoria + Backup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Database dedicated to this disposable CI job, never the team's database.
      MEDLINK_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/medlink_ci
      MEDLINK_TEST_DB_USER: postgres
      MEDLINK_TEST_DB_PASSWORD: medlink_ci_only
      # The scheduler is exercised explicitly by tests; background processing would race fixtures.
      MEDLINK_RESERVAS_SCHEDULER_ENABLED: 'false'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medlink_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: medlink_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d medlink_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run the full Maven test suite against PostgreSQL
        working-directory: backend
        run: bash ./mvnw -B clean verify

      - name: Assert PostgreSQL and full suite tests actually ran and passed
        run: python3 scripts/verificar_tests_postgres.py

      - name: Probar generador de indice de evidencias AC
        run: python3 -m unittest discover -s scripts/tests -p 'test_reportar_evidencia_ac.py' -v

      - name: Regress PostgreSQL temporary-server readiness and real restoration
        shell: pwsh
        run: >-
          ./scripts/tests/backup_restore_regression.ps1
          -OutputDirectory '${{ runner.temp }}/backup-regression'

      - name: Verify complete backup and isolated restoration
        shell: pwsh
        run: >-
          ./scripts/backup_restore.ps1 -Fixture
          -BackupPath '${{ runner.temp }}/medlink-ci.dump'
          -EvidencePath './evidencias/backup_ci.md'

      - name: Verify backup including Flyway history from the disposable CI database
        shell: pwsh
        run: >-
          ./scripts/backup_restore.ps1
          -SourceContainer '${{ job.services.postgres.id }}'
          -Database medlink_ci -User postgres
          -BackupPath '${{ runner.temp }}/medlink-ci-flyway.dump'
          -EvidencePath './evidencias/backup_ci_flyway.md'

      - name: Generar indice AC desde las pruebas reales PostgreSQL
        shell: bash
        run: |
          python3 scripts/reportar_evidencia_ac.py \
            --reports backend/target/surefire-reports \
            --backup-evidence evidencias/backup_ci.md evidencias/backup_ci_flyway.md \
            --sha "$GITHUB_SHA" --out-dir evidencias/indice_ac_postgres
          head -n 10 evidencias/indice_ac_postgres/indice_ac.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve test results for diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: medlink-postgres-surefire-reports
          path: |
            backend/target/surefire-reports/
            evidencias/backup_ci*.md
            evidencias/indice_ac_postgres/
            ${{ runner.temp }}/backup-regression/*.md
          if-no-files-found: warn
          retention-days: 90
