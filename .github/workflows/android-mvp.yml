name: MediLink Android MVP

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-mvp.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-mvp.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: SDK Android 36
        run: sdkmanager 'platforms;android-36'
      - name: Gradle con verificacion de wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Pruebas unitarias y APK debug
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
