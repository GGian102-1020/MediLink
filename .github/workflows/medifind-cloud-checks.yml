name: MediFind cloud checks (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test unchanged backend plus cloud additions
        run: |
          cp -R backend "$RUNNER_TEMP/medifind-backend"
          cp -R deploy/cloud/backend/. "$RUNNER_TEMP/medifind-backend/src/"
          cd "$RUNNER_TEMP/medifind-backend"
          chmod +x mvnw
          ./mvnw -B -ntp test
      - name: Test and build existing websites
        run: |
          for app in frontend admin-web landing; do
            npm --prefix "$app" ci --no-audit --no-fund
            npm --prefix "$app" test
            npm --prefix "$app" run build
          done
      - name: Build cloud image
        run: docker build -f deploy/cloud/Dockerfile -t medifind-cloud-check .
      # This workflow intentionally does not deploy, migrate, or publish releases.
