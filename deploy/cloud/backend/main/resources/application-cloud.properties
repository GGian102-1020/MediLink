server.port=${PORT:10000}
server.address=0.0.0.0
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.data-source-properties.connectTimeout=15
spring.datasource.hikari.data-source-properties.socketTimeout=60
spring.flyway.locations=classpath:db/migration,classpath:db/cloud
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
server.tomcat.accept-count=20
server.error.include-message=never
server.error.include-stacktrace=never
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
medlink.recetas-demo.pdf-alterado.enabled=false
medlink.cloud.scan-daily-limit=${MEDIFIND_SCAN_DAILY_LIMIT:20}
# Do not configure Mailpit or a fictitious external sender in this profile.
