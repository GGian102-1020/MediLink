previews:
  generation: 'off'
services:
  - type: web
    name: medifind-api-ggian102
    runtime: docker
    plan: free
    region: virginia
    repo: https://github.com/GGian102-1020/MediLink
    branch: deploy/medifind-cloud
    dockerfilePath: ./deploy/cloud/Dockerfile
    dockerContext: .
    autoDeployTrigger: 'off'
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET_BASE64
        generateValue: true
      - key: MEDLINK_CORS_ALLOWED_ORIGINS
        value: 'https://medifind-operador-ggian102.pages.dev,https://medifind-admin-ggian102.pages.dev'
      - key: MEDLINK_RECETAS_ESCANEO_ENABLED
        value: 'false'
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: MEDLINK_RECETAS_ESCANEO_TIMEOUT_SECONDS
        value: '60'
      - key: MEDIFIND_SCAN_DAILY_LIMIT
        value: '2'
      - key: MEDIFIND_SCAN_ALLOWED_ACCOUNT_IDS
        sync: false
