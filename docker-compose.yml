services:
  db:
    image: postgres:16-alpine
    container_name: medlink-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medlink}
      POSTGRES_USER: ${POSTGRES_USER:-medlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medlink123}
      # Zona horaria del sistema (Argentina) para el contenedor y la base
      TZ: America/Argentina/Buenos_Aires
      PGTZ: America/Argentina/Buenos_Aires
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecutan en orden alfabético SOLO la primera vez (volumen vacío):
      #   01 -> crea enums, tablas, índices y triggers
      #   02 -> carga los datos de prueba
      - ./database/01_medlink_esquema.sql:/docker-entrypoint-initdb.d/01_medlink_esquema.sql:ro
      - ./database/02_datos_prueba.sql:/docker-entrypoint-initdb.d/02_datos_prueba.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["api"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-medlink}
      DB_USER: ${POSTGRES_USER:-medlink}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-medlink123}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-}
      SERVER_PORT: 8081
      DB_FLYWAY_BASELINE_ON_MIGRATE: ${DB_FLYWAY_BASELINE_ON_MIGRATE:-false}
      MEDLINK_CORS_ALLOWED_ORIGINS: ${MEDLINK_CORS_ALLOWED_ORIGINS:-}
    expose:
      - "8081"

  gateway:
    profiles: ["api"]
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

  adminer:
    image: adminer:4.8.1
    container_name: medlink-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  pgdata:
  caddydata:
  caddyconfig:
