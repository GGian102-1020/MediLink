spring.application.name=medlink-backend
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medlink}
spring.datasource.username=${DB_USER:medlink}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=never
spring.jackson.time-zone=America/Argentina/Buenos_Aires
# Required at startup: base64 of at least 32 random bytes (do not commit a real secret).
medlink.jwt.secret-base64=${JWT_SECRET_BASE64:}
# HTTPS must terminate in reverse proxy when exposed to a client.
server.forward-headers-strategy=framework
# Optional DTO fields should not appear for roles where they do not apply.
spring.jackson.default-property-inclusion=non_null
